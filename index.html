<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Page not found (404)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,700;12..96,800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #eef1f8;
    --ink: #1b2140;
    --muted: #5a6285;
    --accent: #3d5afe;
    --accent-ink: #ffffff;
    --line: #cdd3e6;
    --font: "Bricolage Grotesque", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #12152b;
      --ink: #e7eaf8;
      --muted: #9aa2c7;
      --accent: #8fa2ff;
      --accent-ink: #12152b;
      --line: #2b3157;
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    display: grid;
    place-items: center;
    padding: 24px;
    background: var(--bg);
    color: var(--ink);
    font-family: var(--font);
    line-height: 1.5;
  }
  main { text-align: center; max-width: 34rem; }

  .code {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: clamp(4px, 1.5vw, 12px);
    font-size: clamp(6rem, 26vw, 12rem);
    font-weight: 800;
    line-height: 1;
    letter-spacing: -0.04em;
    margin: 0 0 8px;
  }
  .orbit {
    position: relative;
    width: 0.78em;
    height: 0.78em;
    border: 0.09em solid var(--accent);
    border-radius: 50%;
    flex: none;
  }
  .orbit::after {
    content: "";
    position: absolute;
    inset: 50% auto auto 50%;
    width: 0.16em;
    height: 0.16em;
    margin: -0.08em 0 0 -0.08em;
    background: var(--ink);
    border-radius: 50%;
    animation: drift 6s ease-in-out infinite;
  }
  @keyframes drift {
    0%, 100% { transform: translate(0, 0); }
    25%      { transform: translate(0.16em, -0.12em); }
    50%      { transform: translate(-0.1em, 0.14em); }
    75%      { transform: translate(-0.16em, -0.08em); }
  }

  h1 { font-size: clamp(1.5rem, 4vw, 2rem); margin: 0 0 12px; letter-spacing: -0.01em; }
  p  { margin: 0 auto 20px; color: var(--muted); font-size: 1.05rem; max-width: 30rem; }

  .notice {
    display: flex;
    gap: 12px;
    align-items: flex-start;
    text-align: left;
    max-width: 30rem;
    margin: 0 auto 24px;
    padding: 14px 16px;
    border: 1px solid var(--accent);
    border-radius: 12px;
    background: color-mix(in srgb, var(--accent) 10%, transparent);
  }
  .notice strong { display: block; margin-bottom: 2px; }
  .notice span:not(.dot) { color: var(--muted); font-size: 0.95rem; }
  .dot {
    flex: none;
    width: 10px;
    height: 10px;
    margin-top: 7px;
    border-radius: 50%;
    background: var(--accent);
    animation: pulse 2s ease-in-out infinite;
  }
  @keyframes pulse { 50% { opacity: .35; } }

  .path {
    display: inline-block;
    max-width: 100%;
    overflow-wrap: anywhere;
    padding: 6px 12px;
    margin-bottom: 28px;
    border: 1px solid var(--line);
    border-radius: 8px;
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    font-size: 0.9rem;
    color: var(--muted);
  }
  .path[hidden] { display: none; }

  .actions { display: flex; flex-wrap: wrap; gap: 12px; justify-content: center; }
  .btn {
    appearance: none;
    cursor: pointer;
    font: inherit;
    font-weight: 700;
    padding: 12px 22px;
    border-radius: 10px;
    border: 2px solid var(--accent);
    text-decoration: none;
    transition: transform .15s ease, background-color .15s ease;
  }
  .btn-primary { background: var(--accent); color: var(--accent-ink); }
  .btn-ghost   { background: transparent; color: var(--ink); border-color: var(--line); }
  .btn:hover   { transform: translateY(-1px); }
  .btn:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }

  @media (prefers-reduced-motion: reduce) {
    .orbit::after, .dot { animation: none; }
    .btn { transition: none; }
  }
</style>
</head>
<body>
  <main>
    <div class="code" role="img" aria-label="Error 404">
      <span>4</span><span class="orbit"></span><span>4</span>
    </div>
    <h1>This page doesn't exist</h1>
    <p>The link may be broken, or the page may have been moved or deleted. Check the address, or head back to somewhere that works.</p>
    <div class="notice" role="status">
      <span class="dot" aria-hidden="true"></span>
      <div>
        <strong>Server maintenance in progress</strong>
        <span>We're working on the server. Service will be restored shortly, by 12:00 AM on 13.10.2026.</span>
      </div>
    </div>
    <div class="path" id="path" hidden></div>
  </main>
  <script>
    (function () {
      var el = document.getElementById('path');
      if (el && location.pathname && location.pathname !== '/') {
        el.textContent = location.pathname;
        el.hidden = false;
      }
    })();
  </script>
</body>
</html>
